<!DOCTYPE html>
<html>
<head>
  <title>View Signups</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f0ff;
      padding: 20px;
    }

    h1 {
      color: #5e35b1;
    }

    select {
      padding: 8px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #b39ddb;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 15px;
    }

    th {
      background: #5e35b1;
      color: white;
      padding: 10px;
    }

    td {
      padding: 10px;
      border: 1px solid #ddd;
    }

    tr:nth-child(even) {
      background: #ede7f6;
    }

    .total {
      margin-top: 10px;
      font-weight: bold;
      color: #5e35b1;
    }

    a {
      color: #5e35b1;
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      background: #ede7f6;
      border-radius: 5px;
    }
  </style>
</head>

<body>

<h1>Show List of Students Who Signed-Up</h1>

<a href="signup.html">Back to Signup</a>

<br><br>

<select id="clubFilter">
  <option value="all">All Clubs</option>
  <option>Bake Club</option>
  <option>Himig Agham</option>
  <option>Computron</option>
</select>

<div class="total" id="total"></div>

<table id="table">
  <thead>
    <tr>
      <th>Club</th>
      <th>ID</th>
      <th>Fullname</th>
      <th>Grade</th>
      <th>Email</th>
      <th>Mobile</th>
      <th>Type</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<div id="message" class="message"></div>

<script>
  let signups = JSON.parse(localStorage.getItem("signups")) || [];

  function displayData(filter) {
    let tbody = document.querySelector("tbody");
    let message = document.getElementById("message");

    tbody.innerHTML = "";
    message.innerHTML = "";

    let filtered = filter === "all"
      ? signups
      : signups.filter(s => s.club === filter);

    document.getElementById("total").innerText =
      "Total Signup: " + filtered.length;

    if (filtered.length === 0) {
      message.innerText = "No Sign Ups for the club";
      return;
    }

    filtered.forEach(s => {
      let row = `
        <tr>
          <td>${s.club}</td>
          <td>${s.id}</td>
          <td>${s.fullname}</td>
          <td>${s.grade}</td>
          <td>${s.email}</td>
          <td>${s.mobile}</td>
          <td>${s.type}</td>
        </tr>
      `;
      tbody.innerHTML += row;
    });
  }

  document.getElementById("clubFilter").addEventListener("change", function() {
    displayData(this.value);
  });

  displayData("all");
</script>

</body>
</html>
