<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add / Update Movie Rating</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      margin-top: 40px;
    }
    .container {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      width: 350px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin: 10px 0;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #1e73e8;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .stars span {
      font-size: 20px;
      cursor: pointer;
      color: gray;
    }
    .stars .active {
      color: gold;
    }
    .movie-item {
      background: #eee;
      padding: 10px;
      margin-top: 10px;
      border-radius: 5px;
    }
    .delete-btn {
      margin-top: 5px;
      padding: 5px;
      background: red;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Add / Update a Movie Rating</h2>

  <label>Title:</label>
  <input type="text" id="title">

  <label>Year:</label>
  <input type="text" id="year">

  <label>Genre:</label>
  <select id="genre">
    <option>Action</option>
    <option>Comedy</option>
    <option>Drama</option>
    <option>Horror</option>
  </select>

  <label>Rating:</label>
  <div class="stars" id="stars">
    <span data-value="1">★</span>
    <span data-value="2">★</span>
    <span data-value="3">★</span>
    <span data-value="4">★</span>
    <span data-value="5">★</span>
  </div>

  <button onclick="addOrUpdateMovie()">Add Movie</button>

  <h3>Movie List</h3>
  <div id="movieList"></div>
</div>

<script>
  let rating = 0;

  const stars = document.querySelectorAll('#stars span');
  stars.forEach(star => {
    star.addEventListener('click', () => {
      rating = parseInt(star.getAttribute('data-value'));
      updateStars();
    });
  });

  function updateStars() {
    stars.forEach(star => {
      star.classList.remove('active');
      if (parseInt(star.getAttribute('data-value')) <= rating) {
        star.classList.add('active');
      }
    });
  }

  function addOrUpdateMovie() {
    const title = document.getElementById('title').value;
    const year = document.getElementById('year').value;
    const genre = document.getElementById('genre').value;

    let movies = JSON.parse(localStorage.getItem('movies')) || [];

    const existingIndex = movies.findIndex(m => m.title.toLowerCase() === title.toLowerCase());

    if (existingIndex !== -1) {
      const oldRating = parseInt(movies[existingIndex].rating);
      const newRating = Math.round((oldRating + rating) / 2);

      movies[existingIndex] = { title, year, genre, rating: newRating };
    } else {
      movies.push({ title, year, genre, rating });
    }

    localStorage.setItem('movies', JSON.stringify(movies));

    displayMovies();
  }

  function deleteMovie(index) {
    if (confirm('Are you sure you want to delete this movie?')) {
      let movies = JSON.parse(localStorage.getItem('movies')) || [];
      movies.splice(index, 1);
      localStorage.setItem('movies', JSON.stringify(movies));
      displayMovies();
    }
  }

  function displayMovies() {
    const movieList = document.getElementById('movieList');
    movieList.innerHTML = '';

    let movies = JSON.parse(localStorage.getItem('movies')) || [];

    movies.forEach((movie, index) => {
      const div = document.createElement('div');
      div.classList.add('movie-item');

      let starsDisplay = '';
      for (let i = 0; i < movie.rating; i++) {
        starsDisplay += '★';
      }

      div.innerHTML = `
        ${movie.title} (${movie.year}) - ${movie.genre}, Rating: ${starsDisplay}
        <br>
        <button class="delete-btn" onclick="deleteMovie(${index})">Delete</button>
      `;

      movieList.appendChild(div);
    });
  }

  displayMovies();
</script>

</body>
</html>
