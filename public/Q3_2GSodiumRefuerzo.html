<!DOCTYPE html>
<html>
<head>
<title>Club Application Form</title>

<style>
body{
    font-family: Arial, sans-serif;
    background-color:#f3e8ff;
}

form{
    width:500px;
    margin:auto;
    padding:20px;
    background:white;
    border:2px solid #a855f7;
    border-radius:10px;
}

fieldset{
    margin-bottom:15px;
    padding:10px;
    border:2px solid #c084fc;
}

legend{
    color:#7e22ce;
    font-weight:bold;
}

label{
    display:block;
    margin-top:10px;
}

input, select, textarea{
    width:100%;
    padding:6px;
    margin-top:4px;
    border:1px solid #c084fc;
    border-radius:4px;
}

input:focus, select:focus, textarea:focus{
    background-color:#f5f3ff;
    border:2px solid #7e22ce;
    outline:none;
}

.error{
    border:2px solid #9333ea;
    background-color:#ede9fe;
}

button{
    margin-top:10px;
    padding:8px 15px;
    border:none;
    background-color:#7e22ce;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background-color:#6b21a8;
}
</style>

<script>
function confirmSubmit(){
    return confirm("Are you sure you want to submit your application?");
}

function confirmReset(){
    return confirm("Are you sure you want to reset the form?");
}

function checkEmpty(element){
    if(element.value.trim()==""){
        element.classList.add("error");
    }else{
        element.classList.remove("error");
    }
}
</script>

</head>

<body>

<form method="post" action="submit" onsubmit="return confirmSubmit()" onreset="return confirmReset()">

<fieldset>
<legend>Personal Information</legend>

<label>
Student ID
<input type="number" name="studentid" required onblur="checkEmpty(this)">
</label>

<label>
Full Name
<input type="text" name="fullname" required onblur="checkEmpty(this)">
</label>

<label>
Birthday
<input type="date" name="birthday" required onblur="checkEmpty(this)">
</label>

<label>
Email Address
<input type="email" name="email" required onblur="checkEmpty(this)">
</label>

</fieldset>


<fieldset>
<legend>Additional Information</legend>

<label>
Mobile Phone
<input type="text" name="mobile" required onblur="checkEmpty(this)">
</label>

<label>
Grade Level
<select name="grade" required onblur="checkEmpty(this)">
<option value="">Select Grade</option>
<option value="g7">Grade 7</option>
<option value="g8">Grade 8</option>
<option value="g9">Grade 9</option>
<option value="g10">Grade 10</option>
<option value="g11">Grade 11</option>
<option value="g12">Grade 12</option>
</select>
</label>

<label> Intern
<input type="radio" name="status" value="int" required> Extern 
<input type="radio" name="status" value="ext"> 
</label>

<label>
<select name="club" required onblur="checkEmpty(this)">
<option value="">Choose Club</option>
<option value="robotics">Sagala</option>
<option value="arts">Invictus</option>
<option value="music">Flux</option>
<option value="sports">Alianti</option>
<option value="debate">MUN</option>
</select>
</label>


</fieldset>

<button type="submit">Submit</button>
<button type="reset">Reset</button>

</form>

</body>
</html>
